<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Probamos todas las transformaciones 2D</title>
    <style>
        /* Estilo base para los 4 cuadrados */
        .caja {
            width: 6rem;
            height: 6rem;
            background-color: #3b82f6;
            color: white;
            margin: 1.8rem;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            transition: transform 0.3s;
            /* Las transiciones se deben realizar de forma suave durante al menos 0.3 segundos */
        }

        /* 1. TRANSLATE: Mueve el elemento (X derecha/izquierda, Y arriba/abajo) */
        .mover:hover {
            transform: translate(10px, 15px);
        }

        /* 2. ROTATE: Gira el elemento como las agujas del reloj */
        .girar:hover {
            transform: rotate(80deg);
        }

        /* 3. SCALE: Cambia el tamaño (1 es su tamaño normal, 1.3 es un 30% más grande) */
        .escalar:hover {
            transform: scale(1.4);
        }

        /* 4. SKEW: Deforma o inclina el elemento */
        .inclinar:hover {
            transform: skew(20deg);
        }
    </style>
</head>

<body>
    <div class="caja mover">Mover</div>
    <div class="caja girar">Girar</div>
    <div class="caja escalar">Agrandar</div>
    <div class="caja inclinar">Inclinar</div>
</body>

</html>
