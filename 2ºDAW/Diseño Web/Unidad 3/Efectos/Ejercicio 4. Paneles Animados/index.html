<!DOCTYPE html>

  <title>Tarjetas con Animación de Entrada</title>

<body>

  <section id="contenedor-tarjetas">
    <article class="tarjeta">
      <h2>Plan Básico</h2>
      <p>Ideal para proyectos personales y blogs que están empezando.</p>
      <button type="button">Elegir plan</button>
    </article>

    <article class="tarjeta">
      <h2>Plan Pro</h2>

    <article class="tarjeta">
      <h2>Plan Empresa</h2>
