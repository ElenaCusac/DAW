            "Vin Diesel",
            "Wesley Snipes",
            "Zoe Saldana"
        ]

        //  Cuántos de estos actores se llaman Jason (no repetidos). 
        let actoresJason = [...new Set(
            XUNGOS.filter(nombre =>
                nombre.toLocaleLowerCase().includes("jason")
            )
        )];

        document.getElementById("actorerJason").innerHTML += actoresJason.join(", ");

        // Apellido Adkins
        let actoresAdkins = XUNGOS.filter((actor) =>
            actor.toLowerCase().split(" ").find(palabra => palabra === "adkins")
        );


        if (actoresAdkins.length === 0) {
            document.getElementById("apellido").innerText = "NO EXISTE";
        } else {
            document.getElementById("apellido").innerHTML = actoresAdkins.join("<br>");
        }


    </script>
