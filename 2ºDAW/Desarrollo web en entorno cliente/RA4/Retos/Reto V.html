<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retos JavaScript</title>
</head>

<body>

    <h1>Retos JavaScript</h1>
   
    <p id="frutasTropicales">Frutas del array frutas que sean tropicales: </p>
    <p id="frutasNoTropicales">Frutas del array frutas que NO sean tropicales: </p>
    <p id="frutasStock">Nombre de las frutas con un stock mayor de 21: </p>

    <script>


        let frutas = ["aguacate", "pera", "manzana", "naranja", "tomate", "granada", "mango", "litchi", "nispero"];
        let tropicales = ["aguacate", "mango", "litchi", "nispero"];
        let tropicStock = [
            { fruta: "aguacate", stock: 50 }, 
            { fruta: "mango", stock: 10 }, 
            { fruta: "litchi", stock: 20 }, 
            { fruta: "nispero", stock: 25 }
        ];
        
        // frutas del array frutas que sean tropicales
        let frutasTropicales = frutas.filter((fruta) => {
            for (let i = 0; i < tropicales.length; i++) {
                if (fruta === tropicales[i]) {
                    return tropicales[i];
                }
            }
        });

        document.getElementById("frutasTropicales").innerHTML += frutasTropicales.toString();
        

        // frutas del array frutas que NO sean tropicales
        let frutasNoTropicales = frutas.filter((fruta) => {
            if (!tropicales.includes(fruta)) {
                return fruta;
            }
        });

        document.getElementById("frutasNoTropicales").innerHTML += frutasNoTropicales.toString();

        //Nombre de las frutas con un stock mayor de 21
        let frutasStock = tropicStock.map((elemento) => {
            let nombreFrutas = [];
            if (elemento.stock > 21) {
                document.getElementById("frutasStock").innerHTML += elemento.fruta + " - ";
            }
        });

    </script>

</body>

</html>
