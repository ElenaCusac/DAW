            actor.peliculas.find(pelicula =>
                pelicula.toLowerCase().includes("terminator")
            )
        );

        let peliculasTerminator = actorTerminator.peliculas.filter((pelicula) =>
            pelicula.toLowerCase().includes("terminator")
        );

            document.getElementById("peliculasTerminator").innerHTML +=
