<!DOCTYPE html>
<html>

<body>
    <h2>JavaScript Arrays</h2>
    
    <p id="demo"></p>

    <script>
        var arr1 = [1, 4, 6, 8, 9, 45, 8, 6, 4, 15, 98, 45, 15];

        for (i = 0; i < arr1.length; i++) {

            var repetido = false;

            for (j = 0; j < arr1.length; j++) {

                if (i != j && arr1[i] == arr1[j]) {
                    repetido = true;
                }

            }

            if (repetido == false) {
                document.getElementById("demo").innerHTML += arr1[i] + " ";
            }
        }
    </script>

</body>

</html>
