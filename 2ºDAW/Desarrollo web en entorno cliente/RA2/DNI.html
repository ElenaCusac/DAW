<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNI</title>
</head>

<body>

    <label for="dni">Introduce tu DNI:</label>
    <input type="text" id="dni" placeholder="12345678D">

    <p id="resultado"></p>

    <script>

        var letras = [
            'T', 'R', 'W', 'A', 'G', 'M', 'Y', 'F',
            'P', 'D', 'X', 'B', 'N', 'J', 'Z', 'S',
            'Q', 'V', 'H', 'L', 'C', 'K', 'E', 'T'
        ];

        var dni = document.getElementById("dni");
        var resultado = document.getElementById("resultado");

        dni.addEventListener("blur", function () {

            var valor = dni.value;

            // Separar el número y la letra
            var numero = parseInt(valor.substring(0, 8));
            var letraUsuario = valor.charAt(8).toUpperCase();

            // Comprobar que el número está dentro del rango válido
            if (numero < 0 || numero > 99999999 || isNaN(numero)) {
                resultado.textContent = "El número proporcionado no es válido.";
                return;
            }

            // Calcular el resto de la división entre 23
            var resto = numero % 23;

            // Obtener la letra correspondiente
            var letraCorrecta = letras[resto];

            // Comparar la letra introducida con la calculada
            if (letraUsuario != letraCorrecta) {
                resultado.textContent = "La letra que has indicado no es correcta.";
            } else {
                resultado.textContent = "El número y la letra del DNI son correctos.";
            }

        });

    </script>

</body>

</html>
