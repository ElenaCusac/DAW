<!DOCTYPE html>
<html lang="es">

<body>
    <h2>JavaScript Arrays. 2 arrays ordenados.</h2>

    <p>
        Tenemos dos arrays, arr1 y arr2, y queremos insertarlos de forma
        ordenada en un tercer array arr3.
    </p>

    <p id="demo"></p>

    <script>
        var arr1 = [1, 4, 6, 8, 9, 15];
        var arr2 = [2, 5, 7, 9, 15, 19];
        var arr3 = [];

        for (let i = 0, j = 0; i < arr1.length || j < arr2.length;) {

            if (i >= arr1.length) {
                arr3.push(arr2[j]);
                j++;
            } 
            else if (j >= arr2.length) {
                arr3.push(arr1[i]);
                i++;
            } 
            else if (arr1[i] <= arr2[j]) {
                arr3.push(arr1[i]);
                i++;
            } 
            else {
                arr3.push(arr2[j]);
                j++;
            }
        }

        document.getElementById("demo").innerHTML = arr3;
    </script>
</body>

</html>
