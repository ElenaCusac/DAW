<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de Texto</title>
</head>

<body>
    <label for="mensaje">Escribe tu mensaje:</label><br>
    <textarea id="mensaje" rows="5" cols="40"></textarea>
    <p id="contador">Caracteres restantes: 150</p>

    <script>
        const MAX_CARACTERES = 150;
        let textarea = document.getElementById("mensaje");
        let contador = document.getElementById("contador");

        textarea.addEventListener("input", function () {
            let longitud = textarea.value.length;
            let diferenciaCantidad = MAX_CARACTERES - longitud;

            contador.textContent = "Caracteres restantes: " + diferenciaCantidad;
        })
    </script>

</body>

</html>
