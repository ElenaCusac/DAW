<!DOCTYPE html>
<html lang="es">

<body>
    <h1>Modificando el código HTML</h1>
    <p id="prueba">Modificando el contenido.</p>
    <button type="button"
        onclick="document.getElementById('prueba').innerHTML = 'CAMBIANDO el contenido!'">¡Dale!</button>
    <button type="button"
        onclick="document.getElementById('prueba').innerHTML = 'El contenido se ha cambiado correctamente!'">¡Dale a este segundo botón!</button>
</body>

</html>
