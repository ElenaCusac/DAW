
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retos JavaScript</title>
</head>

<body>
    <h1>Retos JavaScript</h1>
    <ul id="carrakos"></ul>

    <script>
        let carrakos = ["Chevrolet", "Tesla", "BMW", ["Honda", "Infiniti", ["Lexus", "Mercedes", "Kia"], "Hyunday"], ["Mazda", "Mercedes", "Jeep", ["KTM", "Nissan", "Isuzu"]]];

        let xungos = [
            { nombre: "Bruce Lee", carros: ["Chevrolet", "Tesla", "BMW"] },
            { nombre: "Steven Seagal", carros: ["Mazda", "Jeep", "Nissan"] },
            { nombre: "YakiChan", carros: ["Lexus", "Mercedes", "Kia"] }
        ];

        let propietarios = [];

        // Se pide que saques los coches del array pero si tienen dueño lo especifiques.
        function esArray(array) {
            array.forEach((coche) => {
                if (Array.isArray(coche)) {
                    esArray(coche);

                } else {

                    let famoso = xungos.find((famoso) => famoso.carros.find((carro) => carro === coche));

                    if (famoso) {
                        propietarios.push({nombre: coche, propietario: famoso.nombre});

                    } else {
                        propietarios.push({nombre: coche, propietario: "nadie"});
                    }
                }
            });
        }

        // Se recorren todos los arrays.
        esArray(carrakos);

        // Se muestran los resultados por consola.
        console.log(propietarios);

    </script>
</body>

</html>
