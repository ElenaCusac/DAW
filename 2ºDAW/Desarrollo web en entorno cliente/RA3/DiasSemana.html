<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Días de la semana</title>
</head>

<body>
    <p id="campo"></p>

    <script>
        let semana = ["lunes", "martes", "miércoles", "jueves", "viernes", "sábado", "domingo" ];

        let días = dia => dia.length>5;

        document.getElementById("campo").textContent = semana.filter(días);

    </script>

</body>

</html>
