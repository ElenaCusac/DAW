<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const registrarEvento = (mensaje) => {
            let fecha = new Date();

            let horas = fecha.getHours();
            let minutos = fecha.getMinutes();
            let segundos = fecha.getSeconds();

            if (horas < 10) {
                horas = "0" + horas;
            }

            if (minutos < 10) {
                minutos = "0" + minutos;
            }

            if (segundos < 10) {
                segundos = "0" + segundos;
            }

            return "[" + horas + ":" + minutos + ":" + segundos + "] ERROR: " + mensaje;
        };

        console.log(registrarEvento("Conexión fallida"));
    </script>
</body>

</html>
